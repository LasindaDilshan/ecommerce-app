name: ecommerce-api
type: web
dockerfile:
  path: Dockerfile
  context: .
regions:
  - fra
instance_type: free
ports:
  - port: 8080
    protocol: http
env:
  - key: ASPNETCORE_ENVIRONMENT
    value: Production
  - key: ASPNETCORE_URLS
    value: http://+:8080
routes:
  - path: /
    port: 8080
health_checks:
  - port: 8080
    path: /health
    protocol: http
