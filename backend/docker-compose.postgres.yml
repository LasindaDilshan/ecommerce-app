version: '3.8'

# IMPORTANT: Copy .env.example to .env and update with your actual values before running
# docker-compose -f docker-compose.postgres.yml --env-file .env up -d

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: ecommerce-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-ecommerce}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-CHANGE_ME_IN_ENV_FILE}
      - POSTGRES_DB=${POSTGRES_DB:-ecommerce_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ecommerce}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PgAdmin (PostgreSQL Management UI)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ecommerce-pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL:-admin@ecommerce.com}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD:-CHANGE_ME_IN_ENV_FILE}
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - ecommerce-network
    volumes:
      - pgadmin-data:/var/lib/pgadmin

  # Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecommerce-backend
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=${POSTGRES_DB:-ecommerce_db};Username=${POSTGRES_USER:-ecommerce};Password=${POSTGRES_PASSWORD:-CHANGE_ME_IN_ENV_FILE}
      - JwtSettings__SecretKey=${JWT_SECRET_KEY:-CHANGE_ME_IN_ENV_FILE_MIN_32_CHARS}
      - JwtSettings__Issuer=EcommerceAPI
      - JwtSettings__Audience=EcommerceClient
      - Stripe__SecretKey=${STRIPE_SECRET_KEY:-sk_test_placeholder}
      - Stripe__PublishableKey=${STRIPE_PUBLISHABLE_KEY:-pk_test_placeholder}
      - CorsOrigins__0=http://localhost
      - CorsOrigins__1=http://localhost:80
      - CorsOrigins__2=http://frontend
      - CorsOrigins__3=http://frontend:80
      - CorsOrigins__4=http://localhost:4200
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - backend-uploads:/app/wwwroot/uploads
    networks:
      - ecommerce-network
    restart: unless-stopped

  # Frontend (Angular)
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: ecommerce-frontend
    environment:
      - API_URL=http://localhost:5000
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - ecommerce-network
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: ecommerce-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - ecommerce-network
    restart: unless-stopped
    command: redis-server --appendonly yes

networks:
  ecommerce-network:
    driver: bridge

volumes:
  postgres-data:
  pgadmin-data:
  backend-uploads:
  redis-data: